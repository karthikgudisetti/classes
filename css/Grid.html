<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .grid-co{
            /* height:300px;
            width:500px; */
            /* border:2px solid black; */
            display:grid;
            grid-template-columns: 200px 200px 200px ;
            grid-template-rows: 200px 200px 200px;
            gap:10px;
            
        }
        .gd{
            padding: 80px;
            font-size: larger;
            font-weight: 600;
            color:white;
            /* height:100px;
            width:200px; */
        }
    </style>
</head>
<body>
    <div class="grid-co">
        <div class="gd" style="background-color:rgb(55, 55, 235) ;">A</div>
        <div class="gd " style="background-color: rgb(11, 220, 227);">B</div>
        <div class="gd" style="background-color: rgb(217, 13, 239);">C</div>
        <div class="gd" style="background-color: rgb(250, 134, 92);">D</div>
        <div class="gd" style="background-color: rgb(86, 140, 242);">E</div>
        <div class="gd" style="background-color: rgb(248, 235, 182);">F</div>
    </div>
</body>
</html>
