
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboars</title>
    <style>
        .grid{
            height:800px;
            width:900;
        display: grid;
        grid-template-columns: repeat(5,100px);
        grid-template-rows: repeat(5,100px);
    }
    .side{
      grid-column:1/2;
      grid-row: 1/6;
      background-color: blue;
      text-align: center;
      border:5px solid white;
    }
    .nav{
        grid-column: 2/6;
        grid-row: 1/2;
        background-color: aqua;
        text-align: center;
        border:5px solid white;
    }
    .user{
        grid-column: 2/3.5;
        grid-row: 2/3;
        text-align: center;
        background-color: rgb(80, 80, 231);
        border:10px solid white;
    }.rev{
       
        grid-column: 3.5/4.5;
        grid-row: 2/3;
        text-align: center;
        background-color: rgb(60, 250, 187);
        border:10px solid white;
    }
    .order{
        
        grid-column: 4.5/5;
        grid-row: 2/3;
        background-color: coral;
        border:10px solid white;

    }
    .chart{
        grid-column: 2/4;
        grid-row: 3/5;
        background-color: rgb(120, 72, 113);
      
    }
    .table{
        grid-column: 4/5;
        grid-row: 3/5;
        background-color: rgb(240, 15, 199);
    }

    </style>
</head>
<body>
    <div class="grid">
        <div class="side">Side Bar</div>
        <div class="nav"> Top Navigation</div>
        <div class="user"> Users</div>
        <div class="rev">Revenue</div>
        <div class="order"></div>
        <div class="chart"></div>
        <div class="table"></div>
        <div class="w-1"></div>
        <div class="w-2"></div>
        <div class="w-3"></div>
    </div>
    
</body>
</html>
