
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Example1</title>
    <style>
        .grid-cont{
           margin:70px 0px 0px 200px;
            height:610px;
            width:810px;
            display: grid;
            grid-template-columns: repeat(4,200px);
            grid-template-rows: repeat(4,200px);
           
            border:2px solid black;
            gap:3px;
        }
        .grid{
            text-align: center;
          padding:80px;

        }
        
        #g1{
            color: aliceblue;
            font-weight: 700;
            font-size: larger;
            grid-column: 1/3;
        }
        #g2{color: aliceblue;
            font-weight: 700;
            font-size: larger;
            grid-column: 3/4;
            grid-row: 1/3;
        }
        #g3{color: aliceblue;
            font-weight: 700;
            font-size: larger;
             grid-column: 4/5;
            
        }
        #g4{
            color: aliceblue;
            font-weight: 700;
            font-size: larger;
            grid-row: 2/3;
            grid-column: 1/3
        }
        #g5{
            color: aliceblue;
            font-weight: 700;
            font-size: larger;
        }
        #g6{color: aliceblue;
            font-weight: 700;
             grid-column:1/5;
             font-size: larger;
        }
        
    </style>
</head>
<body>
    <div class="grid-cont">
        <div class="grid" id="g1" style="background-color: blue;">A<br>
        grid-column:1/3</div>
        <div class="grid"  id="g2" style="background-color: blueviolet;">B<br>
        grid-row:1/3</div>
        <div class="grid" id="g3" Style="background-color: rgb(22, 234, 163);">C<br>
        grid-column:4/5</div>
        <div class="grid" id="g4" style="background-color: coral;">D<br>
        grid-column:1/3</div>
        <div class="grid" id="g5" style="background-color: rgb(198, 212, 239);">E<br>
        grid-column4/5</div>
        <div class="grid" id="g6" style="background-color:rgb(66, 123, 204) ;">F<br>
        grid-column:1/5</div>
        
     

    </div>
    
</body>
</html>
