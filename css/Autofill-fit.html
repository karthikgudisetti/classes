

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto</title>
    <style>
        .grid{
            height:400px;
            width:900px;
            display: grid;
            /* grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); */
            grid-template-columns: repeat(auto-fit,minmax(100px,1fr));
            grid-template-rows: repeat(3,100px);
            gap:10px;
            
        }
       
        .g{
            border:2px solid black;
        }

    </style>
</head>
<body>
    <div class="grid">
        <div class="g g-1"></div>
        <div class="g g-2"></div>
        <div class="g g-3"></div>
        <div class="g g-4"></div>
        <div class="g g-5"></div>
        <div class="g g-6"></div>
        <div class="g g-7"></div>
        <div class="g g-8"></div>
        <div class="g g-9"></div>
        
    </div>
    
</body>
</html>
