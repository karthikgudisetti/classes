
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .class1{
            background-color: rgb(255, 0, 0);
        }
        .class2{
            background-color: rgb(16, 16, 17);
        }
        .class3{
            background-color: rgb(168, 204, 50);
        }
        .class4{
             background-color: rgb(222, 169, 249);
        }
    </style>
</head>
<body>
    <div class="di"><h1 class="he">Two people were killed</h1> </div>
    <div class="container">Click Me</div>
    <script>
        let divi=document.querySelector('.he')
        setInterval(()=>{
            divi.innerHTML="<p>hello karthik</p>"
        },2000)

        
        setTimeout(() => {
            divi.style.color="green"
        },500);
         setTimeout(() => {
            divi.style.color="yellow"
        },1000);
        setTimeout(() => {
            divi.style.color="red"
        },1500);
        let cont=document.querySelector('.container');
        cont.style.height="100px";
        cont.style.width="200px";
        cont.style.border="2px solid black";
        cont.addEventListener('click',()=>{
            setTimeout(() => {
            cont.classList.add("class1")
        },500);
         setTimeout(() => {
          cont.classList.add("class2")
        },1000);
        setTimeout(() => {
            cont.classList.add("class3")
        },1500);
        setTimeout(() => {
            cont.classList.add("class4")
        },2000);
        setTimeout(() => {
            cont.classList.add("class5")
        },2500);
        })
        
       
    </script>
</body>
</html>
