<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .counter{
            height:400px;
            width:300px;
            border:2px solid black;
            
            margin-left:400px;
        }

        #conatiner{
            height:200px;
            width:200px;
            margin-top:30px;
            margin-left:50px;
            border: 2px solid rgb(249, 166, 166);
           
            background-color: rgb(164, 83, 239);
            color:black;
            display:flex;
            align-items: center;
            justify-content: center;
            font-size:100px;
            border-radius: 20px;
             
        }
        .btns{
            margin:40px;
            display: flex;
            height:40px;
            width:300px;
             
             gap:20px;

             
            
        }
        .btn{
            height: 30px;
            width:70px;
            border:1px dashed black;
            border-radius: 20px;

            
        }
        h1{ 
            margin-left: 50px;
            font-size: 30px;
        }
    </style>
</head>
<body>
      
    <div class="counter">
        <h1>Counter App</h1>
        <div id="conatiner">0</div>
        <div class="btns">
        <button class="btn1 btn">Increase</button>
         <button class="btn2 btn">Decrease</button>
          <button class="btn3 btn">Reset</button>
    </div>
    </div>
    <script>
        let count=0;
        let cont=document.querySelector('#conatiner');
        let inc=document.querySelector('.btn1');
        let dec=document.querySelector('.btn2');
        let Refresh=document.querySelector('.btn3');
       
        inc.addEventListener('click',()=>{
           count++;
           cont.innerText=count;
        })
        dec.addEventListener('click',()=>{
            if(count>0){
           count--;
           cont.innerText=count;}
        })
        Refresh.addEventListener('click',()=>{
           count=0;
           cont.innerText=count;
        })
        
    </script>
    
</body>
</html>
