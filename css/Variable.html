<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
    <style>
        :root{

        }
        .header{margin-top: 150px;
            margin-left: 500px;
            height:400px;
            width:400px;
            border:2px solid rgb(35, 34, 34);
        }
        
        #main1{margin-top: 30px;
            margin-left: 30px;
            height:100px;
            width:350px;
            border:2px solid rgb(31, 33, 29);
            display: inline-block;
        }
        
        .ma{margin-left: 31px;
            margin-top: 30px;
            height:60px;
            width:90px;
            border:2px solid black;
            display: inline-block;
        }
        
        #m3{margin-left: 30px;
            margin-top: 30px;
            height:60px;
            width:60px;
            border:2px solid black;
            border-radius: 50%;
            display: inline-block;
        }
        #m4{margin-left: 30px;
            margin-top: 30px;
            height:60px;
            width:250px;
            border:2px solid black;
            display: inline-block;
        }

    </style>
</head>
<body>
    <div class="header">
      <div id="main1"></div>
      <div class="ma"></div>
      <div class="ma"></div>
      <div class="ma"></div>
      <div id="m3"></div>
      <div id="m4"></div>
    </div>
</body>
</html>
