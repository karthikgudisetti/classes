<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sematic</title>
    <style>
        .parent {
            height: 400px;
            width: 750px;


        }

        #header {
            background-color: crimson;
            height: 35px;
            width: 750px;
            display: inline-block;
            text-align: center;
        }

        #nav {
            background-color: rgb(227, 227, 66);
            height: 20px;
            width: 750px;
            display: inline-block;
            text-align: center;
        }

        .main {
            height: 300px;
            width: 495px;
            background-color: rgb(106, 106, 242);
            display: inline-block;
        }
         #article{
             
             margin-left: 90px;
            height:260px;
            width:175px;
            background-color: cornflowerblue;
            display: inline-block;
            
            text-align: center;


        }
        #section{
            
            height:260px;
            width:175px;
            background-color: cornflowerblue;
            display: inline-block;
            
            text-align: center;


        }


        #aside {
            height: 300px;
            width: 250px;
            background-color: rgb(93, 221, 93);
            display: inline-block;
            text-align: center;

        }

        #footer {
            height: 40px;
            width: 750px;
            background-color: crimson;
            display: inline-block;
            text-align: center;

        }
    </style>
</head>

<body>
    <div class="parent">
        <div id="header">
            header
        </div>
        <div id="nav">
          nav
        </div>
        <div class="main">
            <div id="article">
              article
            </div>
            <div id="section">
                section
            </div>
        </div>
        <div id="aside">
            aside
        </div>
        <div id="footer">
            footer
        </div>
    </div>

</body>

</html>
