<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse:</title>
    <style>
        .txt{
            height:40px;
            width:200px;
            border:1px dashed black;
        }
    </style>
</head>
<body>
    
    <input type="password" placeholder="enter your name" class="txt">
    <button class="btnh">Hide</button>
    
    <script>
       
        let hide=document.querySelector('.btnh')
        let ans=document.querySelector('.txt');
        hide.addEventListener('click',()=>{
            if(ans.type=="password"){
                ans.type="text";
                hide.textContent="hide";

            }
            else{
                ans.type="password";
                hide.textContent="Show";
            }
        })

        
    </script>
</body>
</html>
