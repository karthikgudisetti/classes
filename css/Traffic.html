<!doctype html>
<html lang="en">

    <title>Html concepts</title>
    <style>
        #div1{
            
            height:200px;
            width: 50px;;
            border: 2px solid black;

        }

            border-radius: 50%;

            width:50px
        }
         #div4{
            background-color: yellow;
            border-radius: 50%;
              height:50px;
            width: 50px
        }

    <div id="div1">
     
      <div id="div2"></div>
