<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caluculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="cal1">
          <input type="text" placeholder="0" class="calval" id="display" readonly>
        </div>
        <div class="cl2">
            <button class="pa">Deg</button>
            <button class="pa">Rad</button>
            <button class="pa">x!</button>
            <button class="pa">(</button>
            <button class="pa">)</button>
            <button class="pa">%</button>
            <button class="pa">Ac</button>
            <button class="pa">Inv</button>
            <button class="pa">sin</button>
            <button class="pa">ln</button>
            <button class="pa">7</button>
            <button class="pa">8</button>
            <button class="pa">9</button>
            <button class="pa">/</button>
            <button class="pa">pi</button>
            <button class="pa">cos</button>
            <button class="pa">log</button>
            <button class="pa">4</button>
            <button class="pa">5</button>
            <button class="pa">6</button>
            <button class="pa">X</button>
            <button class="pa">e</button>
            <button class="pa">tan</button>
            <button class="pa">√</button>
            <button class="pa">1</button>
            <button class="pa">2</button>
            <button class="pa">3</button>
            <button class=" pa ">-</button>
            <button class=" pa">Ans</button>
            <button class=" pa">EXP</button>
            <button class=" pa ">X^y</button>
            <button class=" pa ">0</button>
            <button class=" pa ">.</button>
            <button class=" pa ">=</button>
            <button class=" pa">+</button>
           
        </div>
    </div>
    
</body>
</html>
