<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Work</title>
    <style>
       body{
    background-color:#1d1147;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.gird-h{
    height:500px;
    width:650px;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);

    gap:10px;
    padding:10px;
    background:#24125f;
    border-radius:20px;
}

.gird{
    background:#3f2cbf;
    border-radius:20px;
    color:white;
    padding:15px;
}

.g1{
    grid-row:1/2;
    grid-column:1/2;
}

.g2{
    grid-row:1/2;
    grid-column:2/3;
    text-align:center;
}

.g3{
    grid-row:1/2;
    grid-column:3/4;
    text-align:center;
}

.g4{
    grid-row:2/3;
    grid-column:1/2;
}

.g5{
    grid-row:2/3;
    grid-column:2/3;

    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    font-weight:bold;
}

.g6{
    grid-row:3/4;
    grid-column:1/3;
}

.g7{
    background:white;
    color:black;

    grid-row:2/4;
    grid-column:3/4;

    display:flex;
    flex-direction:column;
    justify-content:space-between;
}
        
    </style>
</head>
<body>
    <div class="gird-h">
        <div class="gird g1">
    <p>A complete family of Apps</p>
</div>

<div class="gird g2">
    <h1>25K</h1>
    <p>Weekly Likes</p>
</div>

<div class="gird g3">
    <h1>50K</h1>
    <p>Weekly Viewers</p>
</div>

<div class="gird g4">
    <p>Active Users</p>
    <h1>1,538</h1>
</div>

<div class="gird g5">
    <h2>DESIGN</h2>
</div>

<div class="gird g6">
    <h3>A place to learn UI Design & Web Design.</h3>
</div>

<div class="gird g7">
    <p>Total Subscribers</p>
    <h1 style="font-size:60px;">200K</h1>
</div>

    </div>
    
</body>
</html>
