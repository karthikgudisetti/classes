<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .Gridh{
            height:440px;
            width:440px;
            display: grid;
            grid-template-columns: repeat(4,100px);
            grid-template-rows: repeat(4,100px);
            border: 2px solid black;
           gap:10px;
            
        }
        .g1{
            grid-row: 1/3;
            grid-column: 1/3;
            background-color: aqua;
          
              
            
        }
        .g2{
            grid-column: 3/4;
            grid-row:1/3;
            background-color: rgb(231, 231, 179);
            padding:20px;
        }
        .g3{grid-column: 4/5;
            grid-row:1/3;
            background-color: rgb(89, 89, 235);
            padding:20px;
        }
        .g4{
             grid-row: 3/5;
             grid-column: 1/3;
             background-color: crimson;
             padding:20px;
        }
    </style>
</head>
<body>
    <div class="Gridh">
        <div class="g1"></div>
        <div class="g2"></div>
        <div class="g3"></div>
        <div class="g4"></div>
        <div class="g5" style="background-color: dodgerblue;"></div>
        <div class="g6" style="background-color: rgb(38, 38, 65);"></div>
        <div class="g7" style="background-color: rgb(201, 160, 239);"></div>
        <div class="g8" style="background-color: rgb(245, 114, 114);"></div>
        
    </div>
</body>
</html>
