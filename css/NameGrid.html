<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name</title>
    <style>
        .name{
            margin-top: 50px;
            display: grid;
            grid-template-columns: repeat(6,50px);
            grid-template-rows: repeat(7,50px);
            
        }
        .k{ text-align: center;
            height:40px;
            width:40px;
            border:2px solid black;
            line-height: 40px;
            background-color: black;
            color: aliceblue;
        }
        .k-1{
            grid-row: 1/2;
            grid-column: 1/2;
        }
        .k-2{
            grid-row: 2/3;
            grid-column: 1/2;
        }
        .k-3{
            grid-row: 3/4;
            grid-column: 1/2;
        }
        .k-4{
            grid-row:4/5;
            grid-column: 1/2;
        }
        .k-5{
            grid-row:5/6;
            grid-column: 1/2;
        }
        .k-6{
            grid-row:6/7;
            grid-column: 1/2;
        }
        .k-7{
             grid-row:7/8;
            grid-column: 1/2;

        }
        .k-8{
            grid-row: 4/5;
            grid-column: 2/3;
        }
        .k-9{
            grid-row: 3/4;
            grid-column: 3/4;
        }
        .k-10{
             grid-row: 2/3;
            grid-column: 4/5;
        }
        .k-11{
             grid-row: 1/2;
            grid-column: 5/6;
        }
        .k-12{
          grid-row: 5/6;
          grid-column: 3/4;
        }
        .k-13{
            grid-row:6/7 ;
            grid-column: 4/5;

        }
        .k-14{
            grid-row: 7/8;
            grid-column: 5/6;
        }
    </style>
</head>
<body>
    <div class="name">
        <div class="k k-1">K</div>
        <div class="k k-2">A</div>
        <div class="k k-3">R</div>
        <div class="k k-4">T</div>
        <div class="k k-5">H</div>
        <div class="k k-6">I</div>
        <div class="k k-7">K</div>
        <div class="k k-8">T</div>
        <div class="k k-9">R</div>
        <div class="k k-10">A</div>
        <div class="k k-11">K</div>
        <div class="k k-12">H</div>
        <div class="k k-13">I</div>
        <div class="k k-14">K</div>
       
    </div>
</body>
</html>
